<body data-fate="fate-draw" data-kind="draw"><main class="room"><nav><a href="../../games.html">← 遊戲室</a><a href="../fate-book/">去翻一本書 ↗</a></nav><header><p class="eyebrow">SHI-GAI PLAYROOM <span>靈感小遊戲</span></p><h1 id="gameTitle">命運抽籤</h1><p id="gameDescription">把猶豫放下，讓一支籤帶來小小靈感。</p></header><div class="layout"><section class="play" aria-label="試玩區"><div id="modes" class="modes" role="group" aria-label="選擇玩法"></div><label class="question">心裡想著一個問題，也可以寫下來 <span>選填・只留本頁</span><input id="question" maxlength="160" placeholder="例如：今天要開始那個小計畫嗎？" autocomplete="off"></label><div id="stage" class="stage"><div class="book-art" aria-hidden="true"><div class="book-cover"><span>SHI-GAI</span><b id="coverName">命運之書</b><i>✦</i><small>ONE PAGE, ONE THOUGHT</small></div></div><div class="draw-art" aria-hidden="true"><div class="sticks"><i></i><i></i><i></i><i></i><i></i></div><div class="jar"><b>籤</b><small>SHI-GAI</small></div></div><article id="result" class="result" hidden><p id="resultMode" class="eyebrow"></p><h2 id="resultTitle"></h2><p id="resultText"></p><small id="resultNumber"></small></article></div><p id="status" class="status" role="status">正在準備玩法…</p><div class="actions"><button id="draw" disabled>準備中</button><button id="copy" class="secondary" hidden>複製這次結果</button><button id="retry" class="secondary" hidden>重新載入</button></div></section><aside><p class="eyebrow">HOW TO PLAY</p><h2 id="modeLabel">讓一點偶然，打開新的想法。</h2><p id="gameManagedInstructions">選擇玩法，想好問題，再按按鈕。每次隨機抽取，多個結果時避開連續重複。</p><p class="note">僅供娛樂與靈感，不是預測，也不代替你的判斷。沒有吉凶分數與排行榜。</p><section class="history"><div class="history-head"><h3>本次翻閱與抽籤</h3><button id="clear" class="text-button">清空</button></div><p>最多保留最近 10 筆，離開或重新整理就清除。</p><ol id="history"></ol></section></aside></div><footer>把偶然當作靈感，把選擇留給自己。問題與結果不會上傳。</footer></main></body></html>
