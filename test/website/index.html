<body data-page="home" class="is-home-loading">
  <div class="home-loading-screen" data-home-loading role="status" aria-live="polite" aria-label="Shi-Gai 場景載入中">
    <div class="home-loading-tv" aria-hidden="true">
      <span class="home-loading-signal"></span>
      <span class="home-loading-scanlines"></span>
      <span class="home-loading-mark">SG</span>
    </div>
    <p class="home-loading-title">SHI-GAI SIGNAL</p>
    <p class="home-loading-status" data-home-loading-status>正在連接 Shi-Gai 世界…</p>
    <div class="home-loading-track" aria-hidden="true"><span data-home-loading-bar></span></div>
    <p class="home-loading-percent" data-home-loading-percent>0%</p>
    <button class="home-loading-retry" data-home-loading-retry type="button" hidden>重新載入</button>
  </div>
  <header class="site-header" data-site-header></header>

  <main class="site-main home-main">
    <section class="home-hero hero--morning" data-home-hero data-home-scene aria-label="Shi-Gai 世界入口">
      <div class="home-hero-background" data-home-background aria-hidden="true"></div>
      <div class="home-hero-environment" data-home-environment aria-hidden="true">
        <span class="home-hero-environment-orb"></span>
        <span class="home-hero-environment-stars"></span>
      </div>
      <div class="home-world-scene-render" data-world-scene-render aria-label="Shi-Gai 世界入口"></div>
    </section>
    <div class="home-living-sections" data-home-sections aria-label="今日 Shi-Gai"></div>
  </main>

  <script src="assets/js/home-daily-composition.js?v=v2-m4"></script>
  <script src="assets/js/home-sections.js?v=v2-m5-copy"></script>
